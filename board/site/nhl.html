<html lang="en">

<style>
/* Layout: a game strip across the top, a filter bar, then a ranked board of player rows that open into a detail panel. */
:root {
  --bg: #f5f7f4; --panel: #ffffff; --ink: #18211b; --muted: #5d6b61; --line: #dde3dd;
  --turf: #1f6b3a; --turf-soft: #e3efe6; --gold: #a86a00; --gold-soft: #fbf0d9; --risk: #8a5a9e; --risk-soft: #f1e8f5;
  --bar: #cfe3d5; --tick: #18211b; --pos: #1f6b3a; --neg: #b03a2e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1511; --panel: #161e18; --ink: #e6ece7; --muted: #95a399; --line: #27322a;
  --turf: #5fc27f; --turf-soft: #1c3324; --gold: #e3ac4a; --gold-soft: #33280f; --risk: #c79bdb; --risk-soft: #2b2032;
  --bar: #24412d; --tick: #e6ece7; --pos: #5fc27f; --neg: #ef8a7d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1511; --panel: #161e18; --ink: #e6ece7; --muted: #95a399; --line: #27322a;
  --turf: #5fc27f; --turf-soft: #1c3324; --gold: #e3ac4a; --gold-soft: #33280f; --risk: #c79bdb; --risk-soft: #2b2032;
  --bar: #24412d; --tick: #e6ece7; --pos: #5fc27f; --neg: #ef8a7d; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: var(--turf); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 6vw, 52px); line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.lede { color: var(--muted); max-width: 68ch; margin: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tab { font: 700 18px var(--display); letter-spacing: .03em; text-transform: uppercase; border: 0; background: transparent; color: var(--muted); padding: 8px 14px 10px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--turf); }
.range { position: absolute; top: 2px; bottom: 2px; background: var(--bar); border-radius: 3px; }
.mark { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--turf); }
.line { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--tick); }
.side { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; }
.side.over { color: var(--pos); } .side.under { color: var(--gold); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table.res { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.res td { padding: 7px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.res td.num { text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 14px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip b { font-family: var(--display); font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.game { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: var(--r); padding: 8px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 118px; font: inherit; }
.game .m { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .02em; }
.game .t { font-size: 12px; color: var(--muted); }
.game[aria-pressed="true"] { border-color: var(--turf); box-shadow: inset 0 0 0 1px var(--turf); background: var(--turf-soft); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar input[type="search"] { flex: 1 1 220px; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: 600 13px var(--body); border: 0; background: transparent; color: var(--ink); padding: 8px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
label.tog { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }
.count { color: var(--muted); font-size: 13px; }
.cols { display: grid; gap: 16px; grid-template-columns: 1fr; }
.cols.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.col { display: flex; flex-direction: column; gap: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.colhead { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.colhead h2 { font-family: var(--display); font-size: 22px; margin: 0; letter-spacing: .02em; }
.colhead span { color: var(--muted); font-size: 13px; }
.row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.6fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; font: inherit; color: inherit; }
.row:hover { background: var(--turf-soft); }
.row[aria-expanded="true"] { background: var(--turf-soft); }
.who { display: flex; flex-direction: column; min-width: 0; }
.who .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .s { font-size: 12px; color: var(--muted); }
.meter { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.track { position: relative; height: 10px; background: var(--bg); border-radius: 5px; border: 1px solid var(--line); }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--turf); border-radius: 5px; opacity: .85; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--tick); border-radius: 1px; }
.meter .l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .l b { color: var(--ink); font-size: 14px; }
.price { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-variant-numeric: tabular-nums; }
.price .o { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1; }
.price .e { font-size: 12px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .dim { color: var(--muted); }
.pill { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.pill.value { background: var(--gold-soft); color: var(--gold); }
.pill.likely { background: var(--turf-soft); color: var(--turf); }
.pill.check { background: var(--risk-soft); color: var(--risk); }
.detail { padding: 14px; border-bottom: 1px solid var(--line); background: var(--bg); display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.detail h3 { font-family: var(--display); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.books { display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.books div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.books .best { color: var(--pos); font-weight: 600; }
.why { margin: 0; max-width: 60ch; }
.note { color: var(--muted); font-size: 13px; max-width: 72ch; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.ladder { display: flex; flex-wrap: wrap; gap: 4px; }
.step { font-size: 12px; font-variant-numeric: tabular-nums; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--turf) var(--a), var(--panel)); color: var(--ink); white-space: nowrap; }
.step b { font-family: var(--display); font-size: 14px; }
.step.hot { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.detail.one { grid-template-columns: 1fr; }
table.res th { padding: 6px 14px; text-align: left; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.res th.num { text-align: right; }
table.res tr.hl td { background: var(--turf-soft); font-weight: 600; }
.cols.pl { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-items: start; }
.plctl { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.plctl input[type="search"] { flex: 1 1 200px; min-width: 0; font: inherit; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.pllist { max-height: 70vh; overflow-y: auto; }
.leg { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.add { font: 600 13px var(--body); border: 1px solid var(--turf); color: var(--turf); background: transparent; border-radius: 8px; padding: 5px 10px; cursor: pointer; min-width: 64px; }
.add.on { background: var(--turf); color: var(--bg); }
.slip { position: sticky; top: 12px; }
.acts { display: inline-flex; gap: 12px; }
.lnk { border: 0; background: none; color: var(--turf); font: 600 13px var(--body); cursor: pointer; padding: 0; }
.slipl { padding: 10px 14px; }
.slipl small { color: var(--muted); font-weight: 400; }
.slipl > div { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; }
.slipl small { display: block; font-size: 12px; }
.slipl .num { font-size: 13px; white-space: nowrap; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1; }
.placeat { margin: 0 14px 10px; padding: 8px 12px; border: 1px solid var(--turf); border-radius: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.placeat b { font-family: var(--display); font-size: 19px; color: var(--ink); letter-spacing: .02em; }
.slip .colhead { flex-wrap: wrap; gap: 8px; }
.lnk.sugb { background: var(--turf); color: var(--bg); padding: 5px 10px; border-radius: 8px; }
.sugnote { padding: 10px 14px 0; }
.sidebox { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-variant-numeric: tabular-nums; }
.sidebox .e { font-size: 12px; }
.seg.sides button { display: inline-flex; align-items: baseline; gap: 2px; padding: 6px 10px; }
.seg.sides small { font-weight: 400; opacity: .8; }
.warnc { color: var(--gold); }
.leanmark { font-style: normal; color: var(--gold); font-size: 11px; margin-left: 3px; }
.likemark { font-style: normal; color: #3fa66b; font-size: 12px; font-weight: 700; margin-left: 3px; }
.logbtn { margin-top: 10px; font: 600 13px var(--body); border: 1px solid var(--turf); color: var(--turf); background: transparent; border-radius: 8px; padding: 6px 12px; cursor: pointer; justify-self: start; }
.namebtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.namebtn:hover { text-decoration-color: var(--turf); color: var(--turf); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
.logpanel { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); width: 100%; max-width: 720px; display: flex; flex-direction: column; }
.loghead { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 14px 6px; }
.loghead h2 { font-family: var(--display); font-size: 26px; margin: 0; }
.loghead .dim { font-size: 13px; }
.move { margin: 0 14px 10px; padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; border-left: 4px solid var(--line); background: var(--bg); }
.move b { font-family: var(--display); font-size: 18px; letter-spacing: .02em; }
.move.up { border-left-color: var(--pos); } .move.down { border-left-color: var(--neg); } .move.flat { border-left-color: var(--gold); }
.loghit { margin: 0 14px 10px; padding: 8px 12px; background: var(--turf-soft); border-radius: 8px; font-weight: 600; }
.logfoot { padding: 10px 14px 14px; }
.pin { display: flex; gap: 8px; align-items: center; padding: 0 14px 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pin input { width: 90px; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.stats.pad { padding: 4px 14px 12px; }
.verdict { margin: 0 14px 12px; padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.verdict b { font-family: var(--display); font-size: 20px; letter-spacing: .02em; }
.verdict.good { background: var(--turf-soft); color: var(--ink); } .verdict.good b { color: var(--turf); }
.verdict.warn { background: var(--gold-soft); } .verdict.warn b { color: var(--gold); }
.verdict.bad { background: var(--risk-soft); } .verdict.bad b { color: var(--risk); }
.warns { margin: 0; padding: 0 14px 14px 30px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.warns .bad { color: var(--risk); } .warns .warn { color: var(--gold); } .warns .info { color: var(--muted); }
.leg .who .n { white-space: normal; }
@media (max-width: 520px) { .leg { grid-template-columns: minmax(0, 1fr) auto; } .leg .who { grid-column: 1 / -1; } .leg .price, .leg .sidebox { align-items: flex-start; } }
@media (max-width: 720px) { .slip { position: static; } }
/* the leg list scrolls inside its box only on wide screens; on phones and tablets the page itself scrolls */
@media (max-width: 1024px) { .pllist { max-height: none; overflow: visible; } }
.mgrp { border-bottom: 1px solid var(--line); }
.mgrp > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px; cursor: pointer; list-style: none; font-weight: 600; min-height: 44px; }
.mgrp > summary::-webkit-details-marker { display: none; }
.mgrp > summary::after { content: '▾'; margin-left: 4px; transition: transform .15s; }
.mgrp[open] > summary::after { transform: rotate(180deg); }
.mgrp > summary .dim { font-weight: 400; margin-left: auto; font-size: 13px; }
.mgrp[open] > summary { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); }
.lnk.more { display: block; width: 100%; padding: 14px; text-align: center; font-size: 14px; }
.empty { padding: 24px 14px; color: var(--muted); }
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .meter { grid-column: 1 / -1; grid-row: 2; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .25s ease; } }
.sugnav { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; flex-wrap: wrap; }
.sugnav .lnk { font-size: 22px; line-height: 1; padding: 0 6px; }
.sugnav .seg button { padding: 6px 10px; }
.suglab { font: 600 14px var(--body); min-width: 130px; text-align: center; }
.sugbest { font-size: 12px; }
.savedrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px 0; }
.savedrow .lnk { font-size: 13px; }
.savedchip { display: inline-flex; align-items: center; gap: 2px; }
.savedchip .chip { padding: 4px 10px; font-size: 13px; }
.lnk.althint { font-size: 12px; font-weight: 600; text-align: right; white-space: normal; }
.game .t.wxbad { color: var(--gold); font-weight: 600; }
.seglab { flex-basis: 100%; font-size: 12px; margin-bottom: -4px; }
/* Phones: nothing should need a sideways swipe except a wide table. Tabs, game buttons and button groups wrap

.tablewrap { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }

  .tab { font-size: 15px; padding: 6px 9px 7px; }

  .seg button + button { border-left: 1px solid var(--line); }

  .bar input[type="search"], .plctl input[type="search"] { flex-basis: 100%; }

</style>
<style>

<style>

<script>
const D = JSON.parse(document.getElementById('nhl-data').textContent);

const toAm = (d) => d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1));
const $ = (id) => document.getElementById(id);
let slip = [];
try { slip = JSON.parse(localStorage.getItem('nhl-slip-' + D.day) || '[]').filter((id) => LEG[id]); } catch (e) { slip = []; }
const saveSlip = () => { try { localStorage.setItem('nhl-slip-' + D.day, JSON.stringify(slip)); } catch (e) {} };

// no leg reused across suggestions (same rule as scripts/nhl_board.py)

// among legs that still pay more than they risk on average (edge 1+ pt) and carry no flags
const VALUE_POOL = (D.pool || []).map((id) => LEG[id]).filter(Boolean);

// but nothing priced shorter than -200, so no leg risks much more than it pays
const LIKELY_POOL = D.legs.filter((l) => (l.edge >= 1 || l.pick) && l.p >= 0.55 && l.price >= -200 && !l.flags.length).sort((a, b) => b.p - a.p || b.edge - a.edge);

  const out = [], used = new Set();
  const pool = POOL.filter(kindOk);
  for (let s = 0; s < n; s++) {
    const nG = new Set(pool.map((L) => L.game)).size;
    const slip = [], g = {}, pl = new Set(), perGame = Math.min(3, Math.max(size > 6 ? 3 : 1, Math.ceil(size / Math.max(1, nG))));   // more per game only when the slate is too small
    for (const L of pool) {
      if (used.has(L.id) || (g[L.game] || 0) >= perGame || (L.pid && pl.has(L.pid))) continue;
      slip.push(L.id); g[L.game] = (g[L.game] || 0) + 1; if (L.pid) pl.add(L.pid);
      if (slip.length >= size) break;
    }
    if (slip.length < size) break;
    slip.forEach((id) => used.add(id)); out.push(slip);

// growth score: Kelly bankroll growth of the slip, with each leg's chance cut 2 points for model error
function growth(ids) {
  const p = ids.reduce((a, id) => a * Math.max(0.01, LEG[id].p - 0.02), 1), b = ids.reduce((a, id) => a * dec(LEG[id].price), 1) - 1;
  const f = (b * p - (1 - p)) / b; if (f <= 0) return 0;
  return p * Math.log(1 + f * b) + (1 - p) * Math.log(1 - f);
}
let SIZES = [], BEST = null;
// best parlay size by growth; when no parlay has positive growth (or none can be built), suggest a straight bet
function sizesFor() {
  SIZES = [1, 2, 3, 4, 5, 6, 11].filter((k) => buildSlips(k, 1).length);
  const PS = SIZES.filter((k) => k > 1 && growth(buildSlips(k, 1)[0]) > 0);
  BEST = PS.length ? PS.reduce((a, k) => (growth(buildSlips(k, 1)[0]) > growth(buildSlips(a, 1)[0]) ? k : a), PS[0]) : SIZES.includes(1) ? 1 : null;
}
sizesFor();

try { legCount = +localStorage.getItem('nhl-legs') || null; } catch (e) {}

};

setSize(legCount);
let sugIdx = -1;   // which suggestion is loaded (-1 = own slip)

try { saved = JSON.parse(localStorage.getItem('nhl-saved-' + D.day) || '[]').map((s) => ({ ...s, legs: s.legs.filter((id) => LEG[id]) })).filter((s) => s.legs.length); } catch (e) { saved = []; }

}

function bestSide(pr) {
  const c = [pr.over, pr.under].filter(Boolean);
  if (!c.length) return null;
  return c.reduce((a, b) => (b.edge > a.edge ? b : a));
}

function propRows(k) {
  let ps = SRC(k).filter((p) => p[k]);
  if (state.game !== 'all') ps = ps.filter((p) => p.game === state.game);
  if (state.pos !== 'all' && k !== 'saves') ps = ps.filter((p) => p.pos === state.pos);
  if (state.q) ps = ps.filter((p) => (p.name + ' ' + p.team).toLowerCase().includes(state.q));
  if (hasLines(k)) ps = ps.filter((p) => p[k].line != null);
  const key = { edge: (p) => -((bestSide(p[k]) || {}).edge ?? -99), proj: (p) => -p[k].proj, chance: (p) => -((bestSide(p[k]) || {}).p ?? (p[k].ch ? p[k].ch['3+'] : 0)), name: (p) => p.name };
  const f = key[state.sort] || key.proj;
  return ps.sort((a, b) => { const x = f(a), y = f(b); return x < y ? -1 : x > y ? 1 : 0; });
}

function meter(pr) {
  const max = Math.max(pr.hi, pr.line || 0) * 1.12 || 1;
  const m = el('div', 'meter'); const tr = el('div', 'track');

  tr.append(r, mk);

  const l = el('div', 'l'); const a = el('span'); a.append(el('b', null, pr.proj.toFixed(1)), document.createTextNode(' proj'));
  l.append(a, el('span', null, pr.line != null ? `line ${pr.line}` : `${Math.round(pr.lo)}–${Math.round(pr.hi)}`));
  m.append(tr, l); return m;
}

  B.append(wrap);
  const w = D.weights;
  $('foot').textContent = `Pick to win = the side with the higher blended chance (moneyline ${w.Moneyline * 100}% model, ${100 - w.Moneyline * 100}% DraftKings no-vig). Puck lines and totals lean on DraftKings (${w['Puck line'] * 100}% model) because the model did not beat them in testing. Goalies are ESPN's probable starters; "projected" means not yet listed, so it uses the team's most-used goalie lately. Box scores through ${D.through}.`;
}

function addBtn(id) {
  const on = slip.includes(id);
  const b = el('button', 'add' + (on ? ' on' : ''), on ? 'Added' : 'Add');
  b.onclick = () => { slip = on ? slip.filter((x) => x !== id) : slip.concat(id); sugIdx = -1; saveSlip(); render(); };
  return b;
}

function boardParlay() {
  const B = $('board'); B.innerHTML = '';
  const cols = el('div', 'cols pl');
  const list = el('div', 'col');
  const h = el('div', 'colhead'); h.append(el('h2', null, 'Legs'), el('span', null, mode === 'likely' ? 'Ranked by chance to hit, DraftKings prices' : 'Ranked by edge, DraftKings prices')); list.append(h);
  const ctl = el('div', 'plctl');
  const q = el('input'); q.type = 'search'; q.placeholder = 'Search legs'; q.value = state.pq; q.oninput = (e) => { state.pq = e.target.value.toLowerCase(); drawList(); };
  const kl = el('span', 'dim seglab', 'Markets: tap one or more');
  const kinds = el('div', 'seg'); kinds.setAttribute('aria-label', 'Markets (pick one or more)');
  [['all', 'All']].concat(MKTS.map((k) => [k, k])).forEach(([k, l]) => {
    const b = el('button', null, l); b.setAttribute('aria-pressed', k === 'all' ? !KINDS.size : KINDS.has(k));
    b.onclick = () => {
      if (k === 'all') KINDS.clear(); else if (KINDS.has(k)) KINDS.delete(k); else KINDS.add(k);
      try { localStorage.setItem('nhl-kinds', JSON.stringify([...KINDS])); } catch (e) {}
      sizesFor(); if (!SIZES.includes(legCount)) legCount = BEST; setSize(legCount); sugIdx = -1; render();
    };
    kinds.append(b);
  });
  const mins = el('div', 'seg'); [[0.25, '25%+'], [0.4, '40%+'], [0.55, '55%+']].forEach(([k, l]) => { const b = el('button', null, l); b.setAttribute('aria-pressed', state.pmin === k); b.onclick = () => { state.pmin = k; render(); }; mins.append(b); });
  ctl.append(q, kl, kinds, mins); list.append(ctl);
  const pl = el('div', 'pllist'); list.append(pl);
  function drawList() {
    pl.innerHTML = '';
    let ls = D.legs.filter((l) => l.p >= state.pmin);
    ls = ls.filter(kindOk);
    if (state.pq) ls = ls.filter((l) => (l.label + ' ' + l.game).toLowerCase().includes(state.pq));
    ls.sort(mode === 'likely' ? (a, b) => (b.edge >= 1) - (a.edge >= 1) || b.p - a.p : (a, b) => b.edge - a.edge);
    if (!ls.length) pl.append(el('div', 'empty', 'No legs match.'));
    const row = (L) => {
      const r = el('div', 'leg'); const who = el('div', 'who');
      who.append(legLabel(L, 'n'), el('span', 's', `${L.kind} · ${L.game}${L.flags.length ? ' · ' + L.flags.join('; ') : ''}`));
      const sb = el('div', 'sidebox'); sb.append(el('span', 'o', fmt(L.price)), el('span', 'e ' + (L.edge > 0 ? 'pos' : 'neg'), `${pct(L.p)} · ${sgn(L.edge)}`));
      r.append(who, sb, addBtn(L.id)); return r;
    };
    // phones and tablets: one tap-to-open section per market, so you can jump between markets without scrolling past every leg
    if (matchMedia('(max-width: 1024px)').matches) {
      const ks = MKTS.filter((k) => ls.some((L) => L.kind === k));
      ks.forEach((k) => {
        const gl = ls.filter((L) => L.kind === k), lim = GLIM[k] || 25;
        const d = el('details', 'mgrp'); d.open = OPEN.has(k) || ks.length === 1 || !!state.pq;
        const sm = el('summary'); sm.append(el('span', 'mname', k), el('span', 'dim', `${gl.length} leg${gl.length > 1 ? 's' : ''} · best ${mode === 'likely' ? pct(gl[0].p) : sgn(gl[0].edge)}`));
        d.append(sm); d.ontoggle = () => { if (d.open) OPEN.add(k); else OPEN.delete(k); };
        gl.slice(0, lim).forEach((L) => d.append(row(L)));
        if (gl.length > lim) { const m = el('button', 'lnk more', `Show more ${k} (${gl.length - lim} left)`); m.type = 'button'; m.onclick = () => { GLIM[k] = lim + 25; OPEN.add(k); drawList(); }; d.append(m); }
        pl.append(d);
      });
      return;
    }
    ls.slice(0, 200).forEach((L) => pl.append(row(L)));
  }
  drawList();
  const sl = el('div', 'col slip');
  const sh = el('div', 'colhead'); sh.append(el('h2', null, 'Slip'));
  const acts = el('span', 'acts');
  const clr = el('button', 'lnk', 'Clear'); clr.onclick = () => { slip = []; sugIdx = -1; saveSlip(); render(); };
  acts.append(clr); sh.append(acts); sl.append(sh);
  {
    const md = el('div', 'sugnav');
    md.append(el('b', null, 'Build for'));
    const seg = el('div', 'seg');
    [['value', 'Best value'], ['likely', 'Most likely to hit']].forEach(([k, l]) => { const b = el('button', null, l); b.setAttribute('aria-pressed', mode === k); b.onclick = () => { setMode(k); setSize(legCount); if (SLIPS.length) loadSug(0); else { sugIdx = -1; render(); } }; seg.append(b); });
    md.append(seg);
    md.append(el('span', 'dim sugbest', (mode === 'likely' ? 'Highest-chance legs: board winner picks plus legs with edge 1+, 55%+ chance, nothing shorter than -200' : 'Biggest edge first (edge 3+, 55%+ chance)') + (KINDS.size ? `. Only ${[...KINDS].join(' + ')} legs (market filter).` : '')));
    sl.append(md);
  }
  if (SIZES.length) {
    const lc = el('div', 'sugnav');
    lc.append(el('b', null, 'Legs'));
    const seg = el('div', 'seg');
    SIZES.forEach((k) => { const b = el('button', null, k === BEST ? `${sizeName(k)} ★` : sizeName(k)); b.setAttribute('aria-pressed', k === legCount); b.title = k === BEST ? 'Best number of legs tonight' : ''; b.onclick = () => { setSize(k); loadSug(0); }; seg.append(b); });
    lc.append(seg);
    lc.append(el('span', 'dim sugbest', BEST === 1 ? '★ No parlay is worth it tonight: take a straight bet' : `★ ${BEST} legs is best tonight`));
    sl.append(lc);
  }
  if (SLIPS.length) {
    const nav = el('div', 'sugnav');
    const prev = el('button', 'lnk', '‹'); prev.setAttribute('aria-label', 'Previous suggestion'); prev.onclick = () => loadSug(sugIdx < 0 ? SLIPS.length - 1 : sugIdx - 1);
    const lab = el('span', 'suglab', sugIdx >= 0 ? `${legCount === 1 ? 'Straight bet' : 'Suggestion'} ${sugIdx + 1} of ${SLIPS.length}` : `${SLIPS.length} suggested parlays`);
    const next = el('button', 'lnk', '›'); next.setAttribute('aria-label', 'Next suggestion'); next.onclick = () => loadSug(sugIdx + 1);
    const shuf = el('button', 'lnk sugb', sugIdx < 0 ? 'Load suggested' : 'Shuffle');
    shuf.onclick = () => { if (sugIdx < 0 || SLIPS.length < 2) return loadSug(0); let k = sugIdx; while (k === sugIdx) k = Math.floor(Math.random() * SLIPS.length); loadSug(k); };
    nav.append(prev, lab, next, shuf); sl.append(nav);
  }
  if (saved.length || slip.length) {
    const sv = el('div', 'savedrow');
    if (slip.length) {
      const sb = el('button', 'lnk', 'Save this slip');
      sb.onclick = () => { const key = slip.slice().sort().join('|'); if (!saved.some((s) => s.legs.slice().sort().join('|') === key)) { saved.push({ name: sugIdx >= 0 ? `Suggestion ${sugIdx + 1}` : `My slip ${saved.length + 1}`, legs: slip.slice() }); saveSaved(); } render(); };
      sv.append(sb);
    }
    saved.forEach((s, i) => {
      const on = s.legs.slice().sort().join('|') === slip.slice().sort().join('|');
      const c = el('button', 'chip', s.name); c.setAttribute('aria-pressed', on); c.onclick = () => { slip = s.legs.slice(); sugIdx = -1; saveSlip(); render(); };
      const x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Delete ' + s.name); x.onclick = () => { saved.splice(i, 1); saveSaved(); render(); };
      const w = el('span', 'savedchip'); w.append(c, x); sv.append(w);
    });
    sl.append(sv);
  }
  const legs = slip.map((id) => LEG[id]).filter(Boolean);
  if (!legs.length) sl.append(el('div', 'empty', SLIPS.length ? 'Add legs, or load a suggested parlay. Use the arrows or Shuffle to flip between suggestions, and Save to keep one.' : mode === 'likely' ? 'Add legs from the list. No leg is 55%+ to hit at -200 or longer on this slate.' : 'Add legs from the list. No leg meets the value rule (edge 3+, chance 55%+) on this slate.'));
  const box = el('div', 'slipl');
  legs.forEach((L) => { const d = el('div'); const n = el('span'); n.append(legLabel(L), el('small', null, `${L.game} · ${pct(L.p)}`)); const x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Remove'); x.onclick = () => { slip = slip.filter((i) => i !== L.id); sugIdx = -1; saveSlip(); render(); }; d.append(n, el('span', 'num', fmt(L.price)), x); box.append(d); });
  if (legs.length) {
    sl.append(box);
    const p = legs.reduce((a, l) => a * l.p, 1), d = legs.reduce((a, l) => a * dec(l.price), 1), ev = p * d - 1;
    const st = el('div', 'stats pad');
    [[pct(p), 'Hit chance'], [fmt(toAm(d)), 'Payout'], [sgn(Math.round(ev * 100)) + '%', 'Expected value']].forEach(([v, k]) => { const s = el('div', 'stat'); s.append(el('b', null, v), el('span', null, k)); st.append(s); });
    sl.append(st);
    const games = {}; legs.forEach((l) => { games[l.game] = (games[l.game] || 0) + 1; });
    const warns = [];
    Object.entries(games).filter(([, n]) => n > 1).forEach(([g, n]) => warns.push(['warn', `${n} legs from ${g}: DraftKings prices same-game legs together, so the real payout differs and the legs are not independent.`]));
    legs.filter((l) => l.edge < 0).forEach((l) => warns.push(['bad', `${l.label} has negative edge.`]));
    legs.filter((l) => l.flags.length).forEach((l) => warns.push(['warn', `${l.label}: ${l.flags.join('; ')}.`]));
    const good = ev > 0 && !warns.some((w) => w[0] === 'bad');
    const v = el('div', 'verdict ' + (good ? 'good' : ev > -0.1 ? 'warn' : 'bad'));
    v.append(el('b', null, good ? 'Positive expected value' : ev > -0.1 ? 'Close to break-even' : 'Long shot'), el('span', null, `${legs.length} leg${legs.length > 1 ? "s" : ""}. Chance assumes the legs are independent.`));
    sl.append(v);
    if (warns.length) { const ul = el('ul', 'warns'); warns.forEach(([c, t]) => ul.append(el('li', c, t))); sl.append(ul); }
  }
  cols.append(list, sl); B.append(cols);
  $('foot').textContent = 'Edge is the leg\'s chance minus the break-even of its DraftKings price, in percentage points. Ranking by edge rather than payout keeps long shots from crowding the top. ★ marks the leg count whose top suggestion grows a bankroll fastest (Kelly growth, with each leg\'s chance cut 2 points for model error): more legs raise the payout, but every leg compounds the chance of being wrong. Your slip is saved in this browser.';
}

function boardRecord() {
  const B = $('board'); B.innerHTML = '';
  const bt = D.backtest || {}; const lv = D.live;
  const fmtp = (x) => x == null ? '—' : (x * 100).toFixed(1) + '%';
  const roi = (x) => x == null ? '—' : sgn(Math.round(x * 1000) / 10) + '%';
  const mk = (title, head, rows, note) => { const c = el('div', 'col'); c.style.marginTop = '16px'; const h = el('div', 'colhead'); h.append(el('h2', null, title)); c.append(h); const tw = el('div', 'tablewrap'); const t = el('table', 'res'); const hr = el('tr'); head.forEach((x, i) => hr.append(el('th', i ? 'num' : null, x))); t.append(hr); rows.forEach((r) => { const tr = el('tr'); r.forEach((x, i) => tr.append(el('td', i ? 'num' : null, String(x)))); t.append(tr); }); tw.append(t); c.append(tw); if (note) c.append(el('p', 'note logfoot', note)); B.append(c); };
  if (lv && lv.groups && lv.groups.length) {
    mk('Live record at DraftKings', ['Group', 'Bets', 'W-L', 'Hit', 'Units', 'ROI'], lv.groups.map((g) => [g.group, g.bets, `${g.won}-${g.lost}`, fmtp(g.hit), sgn(g.units), roi(g.roi)]),
       `${lv.days.length} slate${lv.days.length > 1 ? 's' : ''} graded. Every priced leg is logged when the board is built and graded at that DraftKings price, 1 unit per leg.`);
  }
  if (bt.winners) {
    const rows = []; Object.entries(bt.winners).forEach(([se, r]) => { [['model', 'Model'], ['blend', 'Board pick (blend)'], ['draftkings', 'DraftKings favorite']].forEach(([k, l]) => rows.push([`${se.slice(0, 4)}-${se.slice(6)}`, l, r.games, fmtp(r[k].all), r[k].conf60 ? `${fmtp(r[k].conf60[1])} (${r[k].conf60[0]})` : '—'])); });
    mk('Picking winners', ['Season', 'Picker', 'Games', 'Correct', 'When 60%+ sure (games)'], rows, 'Hockey is close to a coin flip: even DraftKings\' favorite wins only about 55-62% of the time. When the board is 60%+ sure, its pick wins about two times in three.');
  }
  if (bt.sog) {
    mk('Shots on goal vs real DraftKings lines', ['Test', 'Lines', 'Log loss: model / DK / blend', 'Edge 0+: bets, hit, ROI', 'Edge 3+: bets, hit, ROI'], Object.entries(bt.sog).map(([se, r]) => [se, r.lines, `${r.ll.model.toFixed(4)} / ${r.ll.market.toFixed(4)} / ${r.ll.blend_50.toFixed(4)}`, `${r.b0.bets}, ${fmtp(r.b0.hit)}, ${roi(r.b0.roi)}`, `${r.b3.bets}, ${fmtp(r.b3.hit)}, ${roi(r.b3.roi)}`]),
       'Lower log loss is better. The blend (half model, half DraftKings) beat DraftKings in both tests, and its picks were almost all Unders. Betting every Under blindly lost money, so the model is choosing which Unders. Samples are still small.');
  }
  const gr = [];
  if (bt.saves) gr.push(['Goalie saves (2025-26)', bt.saves.lines, `${bt.saves.ll.model.toFixed(4)} / ${bt.saves.ll.market.toFixed(4)} / ${bt.saves.ll.blend_50.toFixed(4)}`, `${bt.saves.b3.bets} bets edge 3+: ${roi(bt.saves.b3.roi)}`]);
  if (bt.ml) gr.push(['Moneyline (2025-26)', bt.ml.n, `${bt.ml.ll.model.toFixed(4)} / ${bt.ml.ll.market.toFixed(4)} / ${bt.ml.ll.blend_50.toFixed(4)}`, `${bt.ml.b0.bets} bets edge 0+: ${roi(bt.ml.b0.roi)}`]);
  if (bt.pl) gr.push(['Puck line (2025-26)', bt.pl.n, `${bt.pl.ll.model.toFixed(4)} / ${bt.pl.ll.market.toFixed(4)} / ${bt.pl.ll.blend_50.toFixed(4)}`, `model picks: ${roi(bt.pl.b0.roi)}`]);
  Object.entries(bt.totals || {}).forEach(([se, r]) => gr.push([`Totals at close (${se.slice(0, 4)}-${se.slice(6)})`, r.n, `${r.ll.model.toFixed(4)} / ${r.ll.market.toFixed(4)} / ${r.ll.blend_50.toFixed(4)}`, 'DraftKings better']));
  if (gr.length) mk('Other markets', ['Market', 'Lines', 'Log loss: model / DK / blend', 'Betting result'], gr, 'Models are fit only on earlier seasons. Saves and game lines have not shown a reliable edge, so the board leans on DraftKings for them.');
  if (!B.children.length) B.append(el('div', 'empty', 'No backtest yet.'));
  $('foot').textContent = 'Backtests: scripts/nhl_props_backtest.py and scripts/nhl_game_backtest.py.';
}

// a leg's label, tappable to open the player's game log when the leg is a player prop
function legLabel(L, cls) {
  const pl = L.pid ? SRC(L.market).find((x) => x.id === L.pid) : null;
  if (!pl) return el('span', cls, L.label);
  const b = el('button', (cls ? cls + ' ' : '') + 'namebtn', L.label); b.type = 'button'; b.title = 'Game log';
  b.onclick = (e) => { e.stopPropagation(); openLog(pl, L.market); }; return b;
}
function openLog(p, k) {
  const ov = el('div', 'overlay'); ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  const pn = el('div', 'logpanel'); pn.setAttribute('role', 'dialog'); pn.setAttribute('aria-label', p.name + ' game log');
  const gkp = k === 'saves';
  const h = el('div', 'loghead'); const t = el('div'); t.append(el('h2', null, p.name), el('div', 'dim', gkp ? `${p.team} goalie · ${p.confirmed ? 'confirmed' : 'projected'} starter` : `${p.team} ${p.pos} · ${p.gp} games this season · ${p.toi} min lately`));
  const x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Close'); x.onclick = () => ov.remove(); h.append(t, x); pn.append(h);
  const pr = p[k]; const chips = el('div', 'lchips');
  chips.append(el('span', 'pill likely', `proj ${pr.proj}${pr.line != null ? ' · line ' + pr.line : ''}`));
  if (pr.ch) Object.entries(pr.ch).forEach(([c, v]) => chips.append(el('span', 'pill', `${c} shots: ${pct(v)}`)));
  pn.append(chips);
  if (p.flags.length) pn.append(el('div', 'loghit', p.flags.join('; ')));
  const tw = el('div', 'tablewrap'); const tb = el('table', 'res log');
  const cols = gkp ? [['d', 'Date'], ['o', 'Opp'], ['sa', 'Shots'], ['sv', 'Saves'], ['pct', 'SV%']] : [['d', 'Date'], ['o', 'Opp'], ['toi', 'TOI'], ['sog', 'SOG'], ['g', 'G'], ['a', 'A'], ['blk', 'BLK']];
  const key = gkp ? 'sv' : 'sog';
  const hr = el('tr'); cols.forEach(([, c], i) => hr.append(el('th', i > 1 ? 'num' : null, c))); tb.append(hr);
  p.log.forEach((g) => { const tr = el('tr'); cols.forEach(([c], i) => { const v = c === 'pct' && g[c] != null ? g[c].toFixed(3).slice(1) : g[c]; tr.append(el('td', (i > 1 ? 'num' : '') + (c === key && pr.line != null && g[c] > pr.line ? ' hit' : ''), v ?? '—')); }); tb.append(tr); });
  tw.append(tb); pn.append(tw);
  pn.append(el('p', 'note logfoot', pr.line != null ? `Green marks games over tonight's line of ${pr.line}.` : `Last ${p.log.length} games.`));
  ov.append(pn); document.body.append(ov);
  x.focus();
  const esc = (e) => { if (e.key === 'Escape') { ov.remove(); document.removeEventListener('keydown', esc); } }; document.addEventListener('keydown', esc);
}

function render() {
  header(); strip(); bar();
  if (state.tab === 'games') boardGames();
  else if (state.tab === 'parlay') boardParlay();
  else if (state.tab === 'record') boardRecord();
  else boardProps(state.tab);
}
render();
</script>
