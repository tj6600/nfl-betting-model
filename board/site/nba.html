<style>
/* Layout: a game strip across the top, a filter bar, then a ranked board of player rows that open into a detail panel. */
:root {
  --bg: #f5f7f4; --panel: #ffffff; --ink: #18211b; --muted: #5d6b61; --line: #dde3dd;

  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1511; --panel: #161e18; --ink: #e6ece7; --muted: #95a399; --line: #27322a;
  --turf: #5fc27f; --turf-soft: #1c3324; --gold: #e3ac4a; --gold-soft: #33280f; --risk: #c79bdb; --risk-soft: #2b2032;
  --bar: #24412d; --tick: #e6ece7; --pos: #5fc27f; --neg: #ef8a7d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1511; --panel: #161e18; --ink: #e6ece7; --muted: #95a399; --line: #27322a;
  --turf: #5fc27f; --turf-soft: #1c3324; --gold: #e3ac4a; --gold-soft: #33280f; --risk: #c79bdb; --risk-soft: #2b2032;
  --bar: #24412d; --tick: #e6ece7; --pos: #5fc27f; --neg: #ef8a7d; color-scheme: dark }
* { box-sizing: border-box; }

.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }

.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--turf); }
.range { position: absolute; top: 2px; bottom: 2px; background: var(--bar); border-radius: 3px; }

.side.over { color: var(--pos); } .side.under { color: var(--gold); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
ul.notes { margin: 0; padding: 10px 18px 14px 34px; line-height: 1.5; font-size: 14px; } ul.notes li { margin: 5px 0; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }

.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.game { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: var(--r); padding: 8px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 118px; font: inherit; }

.game .t { font-size: 12px; color: var(--muted); }

.row:hover { background: var(--turf-soft); }
.row[aria-expanded="true"] { background: var(--turf-soft); }
.who { display: flex; flex-direction: column; min-width: 0; }

.fill { position: absolute; inset: 0 auto 0 0; background: var(--turf); border-radius: 5px; opacity: .85; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--tick); border-radius: 1px; }
.meter .l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.price .o { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1; }
.price .e { font-size: 12px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .dim { color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }

.ladder { display: flex; flex-wrap: wrap; gap: 4px; }
.step { font-size: 12px; font-variant-numeric: tabular-nums; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--turf) var(--a), var(--panel)); color: var(--ink); white-space: nowrap; }

<style>
.sportnav { display: flex; flex-wrap: wrap; gap: 6px; max-width: 1080px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 0; }
.sportnav a { font: 700 15px var(--display, sans-serif); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; background: var(--panel); }
.sportnav a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sportnav a.bell { margin-left: auto; padding: 6px 12px; }
</style>
<style>
.gcards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
@media (max-width: 400px) { .gcards { grid-template-columns: 1fr; } }
.gcard .colhead h2 { font-size: 24px; }
.gcard table.res td, .gcard table.res th { padding: 6px 8px; font-size: 14px; }
.gcard table.res td:first-child, .gcard table.res th:first-child { padding-left: 14px; white-space: normal; }
.gcard .add { min-width: 0; padding: 4px 8px; }
.gcard .outs { padding: 8px 14px 12px; font-size: 13px; color: var(--muted); }
.gcard .proj { padding: 10px 14px 4px; display: flex; gap: 18px; flex-wrap: wrap; }
.gcard .proj div { display: flex; flex-direction: column; }
.gcard .proj b { font-family: var(--display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.gcard .proj span { font-size: 12px; color: var(--muted); }
.track .range { position: absolute; top: 1px; bottom: 1px; background: var(--bar); border-radius: 4px; }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; border-radius: 2px; background: var(--turf); }
.track .line { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--tick); }
table.log td, table.log th { padding: 5px 10px; }
table.log td.hit { color: var(--pos); font-weight: 600; }
table.log td.miss { color: var(--neg); font-weight: 600; }
.logpanel .tablewrap { padding: 0 6px 6px; }
.lchips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
.sugnav { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; flex-wrap: wrap; }
.sugnav .lnk:not(.sugb) { font-size: 22px; line-height: 1; padding: 0 6px; }
.suglab { font: 600 14px var(--body); min-width: 130px; text-align: center; }
.sugnav .sugb { margin-left: auto; }
.savedrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px 0; }
.savedchip { display: inline-flex; align-items: center; gap: 2px; }
.savedchip .chip { padding: 4px 10px; font-size: 13px; }
.sugnav .seg button { padding: 6px 10px; }
.sugbest { font-size: 12px; }
</style>

<script>

const saveSlip = () => { try { localStorage.setItem('nba-slip-' + D.day, JSON.stringify(slip)); } catch (e) {} };
// suggested parlays are built here so the leg count can be chosen: best remaining legs, 1 per game and 1 per player,
// no leg reused across suggestions (same rule as scripts/nba_board.py)
// two ways to build: 'value' = biggest edge first (scripts/nba_board.py pool); 'likely' = most likely to hit first,
// among legs that still pay more than they risk on average (edge 1+ pt) and carry no flags
// alternate lines (alt: true, Over only, e.g. "25+ points") as in the NFL builder: a shaky Over main line (under 60%) gives way to
// the same player's likeliest fairly priced alt line at 60%+, and Most likely to hit slips of 3+ legs lead with alt lines
// that are 70%+, cost at most 3 pts of juice and are priced -500 or longer, likeliest first (parlays.py uses the same rules)
// Thomas, 2026-11-16: no leg heavier than -200 and at most 3 legs (live grading: 3+ leg parlays 0 for ~200 on NBA), 'likely' legs judged on
// their chance at no worse than DraftKings' usual juice (edge -3+) instead of a model edge (parlays.py likely(), MAX_JUICE, SHORT_SIZES)
const SECURE = 0.6, ALT_FIRST_P = 0.7, ALT_FIRST_SIZE = 3, ALT_JUICE = 3, ALT_MIN_PRICE = -200, MAX_LEGS = 3;
const ALT_BY = {};
for (const l of D.legs) if (l.alt && !l.flags.length && l.p >= SECURE && l.edge >= -3 && l.price >= ALT_MIN_PRICE) (ALT_BY[l.pid + '|' + l.market] = ALT_BY[l.pid + '|' + l.market] || []).push(l);
Object.values(ALT_BY).forEach((xs) => xs.sort((a, b) => b.p - a.p));
const safer = (l) => (l.alt || l.side !== 'Over' || l.p >= SECURE) ? l : ((ALT_BY[l.pid + '|' + l.market] || []).find((a) => a.p > l.p) || l);
const dedupe = (xs) => { const s = new Set(); return xs.filter((l) => !s.has(l.id) && s.add(l.id)); };
const ALT_FIRST = D.legs.filter((l) => l.alt && !l.flags.length && l.p >= ALT_FIRST_P && l.edge >= -ALT_JUICE && l.price >= ALT_MIN_PRICE).sort((a, b) => b.p - a.p || b.edge - a.edge);
const capped = (xs) => xs.filter((l) => l.price >= ALT_MIN_PRICE);
const VALUE_POOL = capped(dedupe((D.pool || []).map((id) => LEG[id]).filter(Boolean).map(safer)));
const LIKELY_POOL = capped(dedupe(D.legs.filter((l) => l.edge >= -3 && l.p >= 0.55 && l.price >= ALT_MIN_PRICE && !l.flags.length).sort((a, b) => b.p - a.p || b.edge - a.edge).map(safer)));
// props no longer count as value (the model's prop edge lost live), so Most likely to hit is the default
let mode = 'likely';
try { mode = localStorage.getItem('nba-mode') === 'value' ? 'value' : 'likely'; } catch (e) {}

// market filter: pick any mix of markets (e.g. Points + Assists); none picked = every market. Suggestions follow it.
let KINDS = new Set();

try { KINDS = new Set(JSON.parse(localStorage.getItem('nba-kinds') || '[]')); } catch (e) {}
const kindOk = (L) => !KINDS.size || KINDS.has(L.kind);
const MKTS = [...new Set(D.legs.map((L) => L.kind))];
// market family, for mixing markets within a slip (alt and main lines of a stat are one family)
function fam(L) {
  if (L.kind === 'Milestone') return (L.key || '').split('-').pop().toLowerCase();
  let k = L.kind.toLowerCase(); if (k.startsWith('alt ')) k = k.slice(4);
  return k === 'shots on goal' ? 'shots' : k;
}
// up to n slips: at most half of a slip from one market family when the pool allows; legs are used once across the
// suggestions first, then (least-used first) a leg may appear in up to 3, so each size shows n different slips
// whenever the pool allows. Same rule as parlays.py many(). pick(pool, size, allowed, cap) -> array of legs or null
function many(pool, size, n, pick) {

  for (let s = 0; s < n; s++) {

    for (const [mx, c] of [[0, cap], [0, size], [1, cap], [1, size], [2, cap], [2, size]]) {
      const cand = mx ? pool.map((L, i) => [L, i]).sort((a, b) => (uses[a[0].id] || 0) - (uses[b[0].id] || 0) || a[1] - b[1]).map((x) => x[0]) : pool;
      const t = pick(cand, size, (L) => (uses[L.id] || 0) <= mx, c);
      if (t && !seen.has(t.map((L) => L.id).sort().join('|'))) { slip = t; break; }

  const pool = (mode === 'likely' && size >= ALT_FIRST_SIZE ? dedupe(ALT_FIRST.concat(POOL)) : POOL).filter((L) => kindOk(L) && !started(L.game));
  const nG = new Set(pool.map((L) => L.game)).size;
  const perGame = Math.min(3, Math.max(size > 6 ? 3 : 1, Math.ceil(size / Math.max(1, nG))));   // more per game only when the slate is too small
  return many(pool, size, n, (pool, size, allowed, cap) => {

    for (const L of pool) {

function growth(ids) {

  const f = (b * p - (1 - p)) / b; if (f <= 0) return 0;
  return p * Math.log(1 + f * b) + (1 - p) * Math.log(1 - f);
}

}
sizesFor();

setSize(legCount);

  const key = { edge: (p) => -((bestSide(p.props[k]) || {}).edge ?? -99), proj: (p) => -p.props[k].proj, chance: (p) => -((bestSide(p.props[k]) || {}).p ?? 0), name: (p) => p.name };
  const f = key[state.sort] || key.proj;

}

  const tiles = el('div', 'tiles');
  const r0 = bt.rows[0];
  [[`${(r0.ats * 100).toFixed(1)}%`, 'Against the spread', `${r0.ats_n} games, ${bt.seasons}. Break-even is 52.4%.`],
   [`${(r0.tot * 100).toFixed(1)}%`, 'Totals', `${r0.tot_n} games with a listed total`],
   [`${bt.mae_model} vs ${bt.mae_line}`, 'Margin error, model vs line', 'Average miss in points; lower is better']].forEach(([b, k, s]) => { const t = el('div', 'tile'); t.append(el('span', 'k', k), el('span', 'big', b), el('span', 's', s)); tiles.append(t); });
  B.append(tiles);
  const mk = (title, head, rows) => { const c = el('div', 'col'); c.style.marginTop = '16px'; const h = el('div', 'colhead'); h.append(el('h2', null, title)); c.append(h); const tw = el('div', 'tablewrap'); const t = el('table', 'res'); const hr = el('tr'); head.forEach((x, i) => hr.append(el('th', i ? 'num' : null, x))); t.append(hr); rows.forEach((r) => { const tr = el('tr'); r.forEach((x, i) => tr.append(el('td', i ? 'num' : null, x))); t.append(tr); }); tw.append(t); c.append(tw); B.append(c); };
  mk('Game picks by edge size', ['Model edge', 'Spread picks', 'Hit', 'Total picks', 'Hit'], bt.rows.map((r) => [`${r.edge}+ pts`, r.ats_n, (r.ats * 100).toFixed(1) + '%', r.tot_n, (r.tot * 100).toFixed(1) + '%']));
  if (bt.props) {
    mk('Prop projections: average miss', ['Stat', 'Model', 'Season avg', 'Last 10'], bt.props.mae.map((r) => [r.stat, r.model, r.season_avg, r.last10]));
    mk('Prop leans vs a stand-in line (2025-26)', ['Stat', 'Leans', 'Predicted', 'Hit', 'Share overs'], bt.props.cal.map((r) => [r.stat, r.n, pct(r.pred), pct(r.hit), pct(r.overs)]));
  }
  $('foot').textContent = 'Every test fits the model only on games before the day it predicts. Game lines are ESPN\'s listed lines (DraftKings from 2025-26, consensus before). There are no historical prop lines in our data, so prop leans are tested against each player\'s season average rounded to the half point; real DraftKings lines are sharper, so expect less than the hit rate shown. Most leans are Unders because scoring is right-skewed.';
}

// a leg's label, tappable to open the player's game log when the leg is a player prop
function legLabel(L, cls) {
  const pl = L.pid ? D.players.find((x) => x.id === L.pid) : null;
  if (!pl) return el('span', cls, L.label);
  const b = el('button', (cls ? cls + ' ' : '') + 'namebtn', L.label); b.type = 'button'; b.title = 'Game log';
  b.onclick = (e) => { e.stopPropagation(); openLog(pl, L.stat || L.market); }; return b;
}
function openLog(p, k) {
  const ov = el('div', 'overlay'); ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  const pn = el('div', 'logpanel'); pn.setAttribute('role', 'dialog'); pn.setAttribute('aria-label', p.name + ' game log');
  const h = el('div', 'loghead'); const t = el('div'); t.append(el('h2', null, p.name), el('div', 'dim', `${p.team} ${p.pos} · ${p.gp} games this season · ${p.mpg} min lately`));
  const x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Close'); x.onclick = () => ov.remove(); h.append(t, x); pn.append(h);
  const chips = el('div', 'lchips');
  STATS.forEach(([s, l]) => { const pr = p.props[s]; if (!pr) return; chips.append(el('span', 'pill likely', `${l}: proj ${pr.proj}${pr.line != null ? ' · line ' + pr.line : ''} · avg ${p.avg[s] ?? '—'}`)); });
  pn.append(chips);
  if (p.flags.length) pn.append(el('div', 'loghit', p.flags.join('; ')));
  const tw = el('div', 'tablewrap'); const tb = el('table', 'res log');
  const hr = el('tr'); ['Date', 'Opp', 'Min', 'Pts', 'Reb', 'Ast', '3PM', 'PRA'].forEach((c, i) => hr.append(el('th', i > 1 ? 'num' : null, c))); tb.append(hr);
  const line = p.props[k] && p.props[k].line;
  p.log.forEach((g) => { const tr = el('tr'); [g.d, g.o, g.m, g.pts, g.reb, g.ast, g.fg3m, g.pra].forEach((v, i) => { const keyc = ['', '', '', 'pts', 'reb', 'ast', 'fg3m', 'pra'][i]; tr.append(el('td', (i > 1 ? 'num' : '') + (keyc === k && line != null ? (v > line ? ' hit' : ' miss') : ''), v)); }); tb.append(tr); });
  tw.append(tb); pn.append(tw);
  pn.append(el('p', 'note logfoot', line != null ? `Green marks games over tonight's ${SL[k].toLowerCase()} line of ${line}.` : 'Last 12 games played.'));
  ov.append(pn); document.body.append(ov);
  x.focus();
  const esc = (e) => { if (e.key === 'Escape') { ov.remove(); document.removeEventListener('keydown', esc); } }; document.addEventListener('keydown', esc);
}

function render() {
  header(); strip(); bar();
  if (state.tab === 'games') boardGames();
  else if (state.tab === 'parlay') boardParlay();
  else if (state.tab === 'record') boardRecord();
  else boardProps(state.tab);
}
render();
</script>
