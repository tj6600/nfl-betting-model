<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offline</title>
<link rel="icon" href="icons/favicon-32.png">
<style>
:root { --bg:#f5f7f4; --panel:#fff; --ink:#18211b; --muted:#5d6b61; --line:#dde3dd; --turf:#1f6b3a; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1511; --panel:#161e18; --ink:#e6ece7; --muted:#95a399; --line:#27322a; --turf:#5fc27f; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font: 16px/1.55 "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 56px; }
.eyebrow { font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:13px; color:var(--turf); }
h1 { font-size: 34px; line-height:1.1; margin: 6px 0 16px; }
h2 { font-size: 19px; margin: 28px 0 6px; }
p, li { color: var(--ink); } .muted { color: var(--muted); }
a { color: var(--turf); }
</style>
</head>
<body>
<div class="wrap">
<span class="eyebrow">Props Board</span>
<h1>You're offline</h1>
<p class="muted">This page hasn't been saved on this phone yet. Boards you've opened before still work offline. Reconnect to load the latest picks.</p>
<p><a href="/">Try again</a></p>
</div>
</body>
</html>
