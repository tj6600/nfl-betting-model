# Phone alerts for GoonerGamble: when a scheduled run pushes a new NFL/NBA/NHL board, notify every phone
# set up on the site's bell page (board/site/alerts.html). The phones' alert codes live in the GG_PUSH secret.
name: Phone alerts
on:
  push:
    branches: [epa-model]
    paths: ['board/site/index.html', 'board/site/nba.html', 'board/site/nhl.html']
  workflow_dispatch:   # "Run workflow" button: send a test alert right away
    inputs:
      sport:
        description: Board the alert opens
        type: choice
        options: [nfl, nba, nhl]
        default: nfl
      message:
        description: Alert text
        default: Test alert from GoonerGamble. Alerts are working.
permissions:
  contents: read
concurrency:
  group: phone-alerts
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/push_alert.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography
      - name: Send test alert
        if: github.event_name == 'workflow_dispatch'
        env:
          GG_PUSH: ${{ secrets.GG_PUSH }}
          SPORT: ${{ inputs.sport }}
          MESSAGE: ${{ inputs.message }}
        run: python scripts/push_alert.py "$SPORT" "$MESSAGE" --title "GoonerGamble test" --delay 0
      - name: Send alert (waits for Render to publish the board)
        if: github.event_name == 'push'
        env:
          GG_PUSH: ${{ secrets.GG_PUSH }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python scripts/push_alert.py --from-commit "$COMMIT_MESSAGE" --delay 150
